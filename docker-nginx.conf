# Hashed build assets never change; everything else (HTML, config, sw) must be
# revalidated, otherwise browsers keep an old page that points at deleted assets.
map $uri $cache_control {
  ~^/(public/element-call/)?assets/  "public, max-age=31536000, immutable";
  default                            "no-cache";
}

server {
  listen 80;
  listen [::]:80;

  location / {
    root /usr/share/nginx/html;

    add_header Cache-Control $cache_control always;

    rewrite ^/config.json$ /config.json break;
    rewrite ^/manifest.json$ /manifest.json break;

    rewrite ^/sw.js$ /sw.js break;
    rewrite ^/pdf.worker.min.js$ /pdf.worker.min.js break;

    rewrite ^/public/(.*)$ /public/$1 break;
    rewrite ^/assets/(.*)$ /assets/$1 break;

    rewrite ^(.+)$ /index.html break;
  }
}
